name: Build installers

# Builds The-Retro-Shelf-<version>-mac-arm64.dmg (Apple silicon), -mac-x64.dmg (Intel) and
# The-Retro-Shelf-Setup-<version>.exe, plus the files the app's updater reads (latest*.yml, the Mac .zips).
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also get a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: vendor/.cache
          key: emulators-${{ matrix.target }}-${{ hashFiles('src/config.json', 'scripts/fetch-emulators.mjs') }}

      - name: Fetch RetroArch and cores
        run: node scripts/fetch-emulators.mjs ${{ matrix.target }}

      - name: Build
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # macOS builds are ad-hoc signed (identity "-" in package.json) until a Developer ID is set up
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - uses: actions/upload-artifact@v4
        with:
          name: the-retro-shelf-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # a draft, so nothing is public until you press Publish on the release page
      - name: Create draft release
        run: |
          cat > notes.md <<'NOTES'
          **Mac**: download the `.dmg` for your Mac, open it and drag The Retro Shelf to Applications.
          - Apple silicon (M1 and newer): `mac-arm64.dmg`
          - Intel: `mac-x64.dmg`

          Not sure which? Apple menu → About This Mac: "Chip" means Apple silicon, "Processor" means Intel.
          The app isn't notarized yet, so the first time macOS will refuse to open it: go to
          System Settings → Privacy & Security, scroll down and click **Open Anyway**.

          **Windows** (10 and 11): download and run the `Setup .exe`. If SmartScreen appears, click
          **More info → Run anyway**.

          After this, The Retro Shelf updates itself. No games are included. See the README for where to get games legally.
          NOTES
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "The Retro Shelf $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
