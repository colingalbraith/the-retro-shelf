name: Build installers

# Builds The-Retro-Shelf-<version>-mac-arm64.dmg (Apple silicon), -mac-x64.dmg (Intel) and
# The-Retro-Shelf-Setup-<version>.exe, a portable Windows .zip, The-Retro-Shelf-<version>-linux-x86_64.AppImage,
# plus the files the app's updater reads (latest*.yml, the Mac .zips).
# Each build is then checked: the last release updates itself to it (scripts/update-test.mjs), and it's installed,
# opened and a test game played (scripts/smoke.mjs).
# Run it by hand from the Actions tab, or push a tag like v0.1.0 to also get a draft release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: mac
          - os: windows-latest
            target: win
          # an older Ubuntu, so the AppImage runs on older Linux systems too
          - os: ubuntu-22.04
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Cache emulator downloads
        uses: actions/cache@v4
        with:
          path: vendor/.cache
          key: emulators-${{ matrix.target }}-${{ hashFiles('src/config.json', 'scripts/fetch-emulators.mjs') }}

      - name: Fetch RetroArch and cores
        run: node scripts/fetch-emulators.mjs ${{ matrix.target }}

      - name: Build
        run: npx electron-builder --${{ matrix.target }} --publish never
        env:
          # macOS builds are ad-hoc signed (identity "-" in package.json) until a Developer ID is set up
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      # installs the last release and has it update itself to this build, the way people get it
      - name: Update from the last release
        run: node scripts/update-test.mjs
        env:
          GH_TOKEN: ${{ github.token }}

      # the portable Windows copy: the installed app's files and portable.txt, which keeps everything in a Data folder
      # beside it (for a USB stick)
      - name: Portable copy
        if: matrix.target == 'win'
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          rm -rf "dist/The Retro Shelf" && cp -r dist/win-unpacked "dist/The Retro Shelf"
          printf 'The Retro Shelf keeps its games, saves and settings in the Data folder beside it.\r\n' > "dist/The Retro Shelf/portable.txt"
          (cd dist && 7z a -tzip -mx=5 "The-Retro-Shelf-$v-portable-win.zip" "The Retro Shelf" > /dev/null)

      # installs it (Windows), opens it with one small test game, and plays it: a build that can't doesn't get released
      - name: Open the app and play a game
        if: matrix.target != 'linux'
        run: node scripts/smoke.mjs
      # the bundled RetroArch starts at all on its own (on Linux it's an unpacked AppImage, started through a script)
      - name: RetroArch runs
        if: matrix.target == 'linux'
        run: |
          ls -la dist/linux-unpacked/resources/emulators/RetroArch | head -20
          dist/linux-unpacked/resources/emulators/RetroArch/retroarch --version
      - name: Open the app and play a game (on a virtual screen)
        if: matrix.target == 'linux'
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/smoke.mjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.target }}
          path: dist/smoke
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: the-retro-shelf-${{ matrix.target }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          pattern: the-retro-shelf-*
          merge-multiple: true
      # a draft, so nothing is public until you press Publish on the release page
      - name: Create draft release
        run: |
          # what's new: this version's section of CHANGELOG.md
          awk -v v="${GITHUB_REF_NAME#v}" '/^## /{p = ($2 == v); next} p' CHANGELOG.md > whatsnew.md
          { [ -s whatsnew.md ] && { echo "## What's new"; cat whatsnew.md; echo; echo "## Download"; echo; }; } > notes.md
          cat >> notes.md <<'NOTES'
          **Mac**: download the `.dmg` for your Mac, open it and drag The Retro Shelf to Applications.
          - Apple silicon (M1 and newer): `mac-arm64.dmg`
          - Intel: `mac-x64.dmg`

          Not sure which? Apple menu → About This Mac: "Chip" means Apple silicon, "Processor" means Intel.
          The app isn't signed by Apple, so the first time macOS won't open it. Click **Done**, then open
          System Settings → Privacy & Security, scroll down to Security, click **Open Anyway** and confirm.

          **Windows** (10 and 11): download and run the `Setup .exe`. If SmartScreen appears, click
          **More info → Run anyway**.

          After this, The Retro Shelf updates itself. No games are included. See the README for where to get games legally.
          NOTES
          # a test version (v0.4.0-beta.1) is a prerelease: only people who chose test versions get it
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft $pre \
            --title "The Retro Shelf $GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
