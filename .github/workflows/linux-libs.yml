name: Linux RetroArch libraries

# Run by hand: which shared libraries the bundled Linux RetroArch and its cores need from the system, on a plain
# Ubuntu 22.04 machine
on: workflow_dispatch

jobs:
  libs:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-emulators.mjs linux
      - name: What RetroArch needs
        run: |
          RA=vendor/linux/RetroArch
          echo "--- bundled in usr/lib:"; ls $RA/usr/lib | tr '\n' ' '; echo
          echo "--- RUNPATH:"; readelf -d $RA/usr/bin/retroarch | grep -E "RPATH|RUNPATH" || true
          echo "--- NEEDED:"; readelf -d $RA/usr/bin/retroarch | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/' | tr '\n' ' '; echo
          echo "--- not found on this machine:"; ldd $RA/usr/bin/retroarch | grep "not found" || echo "(none)"
          echo "--- jack symbols used:"; nm -D --undefined-only $RA/usr/bin/retroarch | grep -i jack || true
          echo "--- cores missing libraries:"; for c in vendor/linux/cores/*.so; do m=$(ldd $c | grep "not found"); [ -n "$m" ] && echo "$c: $m"; done; echo done
