name: Website

# The download page on GitHub Pages (colingalbraith.github.io/the-retro-shelf): site/index.html with the README's
# pictures and the latest release's downloads, in English and the app's other languages (scripts/site.mjs, site/words).
# Published again when the page, its words or its pictures change, and when a release comes out, so its button
# always offers the newest version.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/**", "scripts/site.mjs", "scripts/site-words.mjs", ".github/workflows/pages.yml"]
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # a release: publish again from main (GitHub Pages only takes main, not a release's tag), so the button offers it
  refresh:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}
  publish:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Put the site together
        run: node scripts/site.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deploy
        uses: actions/deploy-pages@v4
