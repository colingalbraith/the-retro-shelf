name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # every screen and box back at small and large windows, a controller through every panel (scripts/ui-test.mjs)
      - name: Screen tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends xvfb > /dev/null
          xvfb-run -a --server-args="-screen 0 1920x1080x24" node scripts/ui-test.mjs
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Linux'
        with:
          name: screens
          path: dist/ui-test
          if-no-files-found: ignore
