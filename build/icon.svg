<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#36312b"/><stop offset="1" stop-color="#191715"/></linearGradient>
    <radialGradient id="spot" cx=".5" cy=".46" r=".5"><stop offset="0" stop-color="#ffce96" stop-opacity=".18"/><stop offset="1" stop-color="#ffce96" stop-opacity="0"/></radialGradient>
    <linearGradient id="sheen" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#000" stop-opacity=".30"/><stop offset=".3" stop-color="#fff" stop-opacity=".10"/><stop offset=".62" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <linearGradient id="plank" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6a4a30"/><stop offset="1" stop-color="#523722"/></linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#wall)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#spot)"/>

    <!-- cream box -->
    <g transform="translate(228 352)">
      <rect width="118" height="356" fill="#ece6d6"/>
      <rect width="118" height="76" fill="#1c1916"/>
      <rect x="44" y="112" width="30" height="176" rx="6" fill="#1c1916" opacity=".82"/>
      <rect x="49" y="314" width="20" height="20" fill="#1c1916"/>
      <rect width="118" height="356" fill="url(#sheen)"/>
    </g>
    <!-- orange box, the selected one: a little taller and forward -->
    <g transform="translate(356 262)">
      <rect width="156" height="446" fill="#e2582b"/>
      <rect width="156" height="92" fill="#1c1916"/>
      <rect x="60" y="134" width="36" height="226" rx="7" fill="#fff4e8" opacity=".92"/>
      <rect x="66" y="392" width="24" height="24" fill="#1c1916"/>
      <rect width="156" height="446" fill="url(#sheen)"/>
    </g>
    <!-- blue box -->
    <g transform="translate(522 396)">
      <rect width="104" height="312" fill="#2f5a7a"/>
      <rect width="104" height="66" fill="#ece6d6"/>
      <rect x="39" y="98" width="26" height="150" rx="5" fill="#f1ead9" opacity=".9"/>
      <rect x="43" y="272" width="18" height="18" fill="#ece6d6"/>
      <rect width="104" height="312" fill="url(#sheen)"/>
    </g>
    <!-- green box -->
    <g transform="translate(636 318)">
      <rect width="126" height="390" fill="#3e6b4f"/>
      <rect width="126" height="82" fill="#d9a531"/>
      <rect x="47" y="120" width="32" height="196" rx="6" fill="#f1ead9" opacity=".9"/>
      <rect x="53" y="344" width="20" height="20" fill="#d9a531"/>
      <rect width="126" height="390" fill="url(#sheen)"/>
    </g>
    <!-- bookend -->
    <rect x="790" y="470" width="14" height="238" rx="3" fill="#4a4743"/>
    <rect x="778" y="702" width="40" height="8" rx="2" fill="#3b3936"/>

    <!-- shelf -->
    <rect x="100" y="708" width="824" height="6" fill="#3f2a1a"/>
    <rect x="100" y="714" width="824" height="22" fill="#8d6644"/>
    <rect x="100" y="736" width="824" height="4" fill="#a67b54"/>
    <rect x="100" y="740" width="824" height="62" fill="url(#plank)"/>
    <rect x="100" y="802" width="824" height="6" fill="#24170d"/>
    <rect x="100" y="808" width="824" height="70" fill="url(#drop)"/>
    <!-- brass plate -->
    <rect x="402" y="752" width="220" height="36" rx="3" fill="#bf9f63"/>
    <circle cx="420" cy="770" r="5" fill="#7d6436"/>
    <circle cx="604" cy="770" r="5" fill="#7d6436"/>
    <rect x="446" y="765" width="132" height="10" rx="5" fill="#3a2c14" opacity=".75"/>
  </g>
</svg>
